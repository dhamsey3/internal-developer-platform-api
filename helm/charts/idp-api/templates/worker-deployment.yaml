{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idp-api.fullname" . }}-worker
  labels:
    app: {{ include "idp-api.name" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "idp-api.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "idp-api.name" . }}-worker
    spec:
      serviceAccountName: {{ include "idp-api.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: terraform-worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required; pin an immutable release tag or digest" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "services.infra_worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "idp-api.fullname" . }}-config
            - secretRef:
                name: {{ include "idp-api.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
