name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test-idp.db
      SECRET_KEY: ci-test-secret
      KUBERNETES_DRY_RUN: "true"
      TERRAFORM_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install flake8
          flake8 app api auth database services tests --max-line-length=120
      - name: Run tests
        run: |
          pytest
      - name: Build Docker image
        run: |
          docker build -t idp-api:${{ github.sha }} .
      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main'
        run: echo "Configure registry login and docker push here"

  deploy-vm:
    name: Deploy to Ubuntu VM
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    env:
      IMAGE_NAME: idp-api
      CONTAINER_NAME: idp-api
      APP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Create runtime environment file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          test -n "$APP_ENV"
          printf '%s\n' "$APP_ENV" > .env
          chmod 600 .env

      - name: Build Docker image on VM
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Deploy container
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            --env-file .env \
            --env DATABASE_URL=sqlite:////data/idp.db \
            --volume idp-api-data:/data \
            -p $APP_PORT:8000 \
            $IMAGE_NAME:${{ github.sha }}

      - name: Check health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:$APP_PORT/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 $CONTAINER_NAME
          exit 1
