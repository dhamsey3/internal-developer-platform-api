name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: idp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./test-idp.db
      SECRET_KEY: ci-test-secret
      KUBERNETES_DRY_RUN: "true"
      TERRAFORM_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install flake8
          flake8 app api auth database services tests --max-line-length=120
      - name: Run tests
        run: |
          pytest
      - name: Build Docker image
        run: |
          docker build -t idp-api:${{ github.sha }} .
      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main'
        run: echo "Configure registry login and docker push here"

  terraform-check:
    name: Validate AWS Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TERRAFORM_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: pip install "jinja2>=3.1,<4.0" "pydantic>=1.10,<2.0" "python-dotenv>=1.0,<2.0"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Render sandbox configuration
        run: |
          mkdir -p terraform-runtime
          python -m scripts.render_terraform \
            --cluster-name idp-ci \
            --aws-region eu-central-1 \
            --state-bucket idp-ci-state \
            --public-access-cidr 203.0.113.10/32 \
            --output terraform-runtime/main.tf

      - name: Format and validate
        working-directory: terraform-runtime
        run: |
          terraform fmt
          terraform init -backend=false
          terraform validate

  deploy-vm:
    name: Deploy to Ubuntu VM
    needs: [build, terraform-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, idp-vm]
    timeout-minutes: 30
    env:
      IMAGE_NAME: idp-api
      CONTAINER_NAME: idp-api
      APP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Create runtime environment file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          test -n "$APP_ENV"
          printf '%s\n' "$APP_ENV" > .env
          chmod 600 .env

      - name: Build Docker image on VM
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Deploy container
        run: |
          previous_image=$(docker inspect --format '{{.Config.Image}}' $CONTAINER_NAME 2>/dev/null || true)
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            --env-file .env \
            --env DATABASE_URL=sqlite:////data/idp.db \
            --volume idp-api-data:/data \
            --volume idp-kubeconfig:/home/appuser/.kube \
            -p $APP_PORT:8000 \
            $IMAGE_NAME:${{ github.sha }}

      - name: Check health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:$APP_PORT/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 $CONTAINER_NAME
          docker rm --force $CONTAINER_NAME
          if [ -n "$PREVIOUS_IMAGE" ]; then
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --env-file .env \
              --env DATABASE_URL=sqlite:////data/idp.db \
              --volume idp-api-data:/data \
              --volume idp-kubeconfig:/home/appuser/.kube \
              -p $APP_PORT:8000 \
              "$PREVIOUS_IMAGE"
          fi
          exit 1

      - name: Remove runtime environment file
        if: always()
        run: rm -f .env
