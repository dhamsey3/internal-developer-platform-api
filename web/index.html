<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal Developer Platform</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">AWS-first platform engineering</p>
        <h1>Internal Developer Platform</h1>
      </div>
      <div class="session">
        <span id="sessionStatus">Signed out</span>
        <button id="logoutButton" class="ghost" type="button">Sign out</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel auth-panel">
        <div class="panel-heading">
          <h2>Access</h2>
          <span class="pill">JWT</span>
        </div>
        <div class="tabs" role="tablist">
          <button id="loginTab" class="tab active" type="button">Login</button>
          <button id="registerTab" class="tab" type="button">Register</button>
        </div>
        <form id="authForm" class="form">
          <label>
            Username
            <input
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="64"
              pattern="[A-Za-z0-9_.-]+"
              title="Use letters, numbers, dots, underscores, or hyphens."
              placeholder="platform-admin"
            />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
          </label>
          <button id="authSubmit" type="submit">Login</button>
        </form>
        <p id="authMessage" class="message"></p>
      </section>

      <section class="panel cluster-panel">
        <div class="panel-heading">
          <h2>AWS Cluster</h2>
          <span id="clusterStatus" class="pill">not provisioned</span>
        </div>
        <form id="clusterForm" class="form grid-form">
          <label>
            Cluster name
            <input id="clusterName" required minlength="3" maxlength="63" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="platform-dev" />
          </label>
          <label>
            AWS region
            <input id="awsRegion" required value="us-east-1" pattern="[a-z]{2}-[a-z]+-[0-9]" />
          </label>
          <label class="wide">
            EKS cluster role ARN
            <input id="eksRoleArn" required placeholder="arn:aws:iam::123456789012:role/EKSClusterRole" />
          </label>
          <label class="wide">
            EKS node role ARN
            <input id="nodeRoleArn" required placeholder="arn:aws:iam::123456789012:role/EKSNodeRole" />
          </label>
          <label>
            Terraform state bucket
            <input id="stateBucket" required placeholder="company-terraform-state" />
          </label>
          <label>
            DynamoDB lock table
            <input id="lockTable" required placeholder="company-terraform-locks" />
          </label>
          <label class="wide">
            IDP public egress CIDR
            <input id="publicAccessCidr" required placeholder="203.0.113.10/32" pattern="([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}" />
          </label>
          <label class="checkbox-label wide">
            <input id="singleNatGateway" type="checkbox" checked />
            Use one NAT gateway for this development cluster
          </label>
          <button class="wide" type="submit">Provision EKS Cluster</button>
        </form>
        <p id="clusterMessage" class="message"></p>
      </section>

      <section class="panel deploy-panel">
        <div class="panel-heading">
          <h2>Create App</h2>
          <span id="modePill" class="pill">dry-run</span>
        </div>
        <form id="deployForm" class="form grid-form">
          <label>
            App template
            <select id="templateSelect">
              <option value="">Custom app</option>
            </select>
          </label>
          <label>
            Image catalog
            <select id="imageSelect">
              <option value="">Custom image</option>
            </select>
          </label>
          <label>
            App name
            <input id="appName" required minlength="3" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="orders-api" />
          </label>
          <label>
            Docker image
            <input id="image" required placeholder="nginx:1.25" />
          </label>
          <label>
            Port
            <input id="port" type="number" min="1" max="65535" value="80" required />
          </label>
          <label>
            Replicas
            <input id="replicas" type="number" min="1" max="20" value="2" required />
          </label>
          <label>
            Min replicas
            <input id="minReplicas" type="number" min="1" max="20" value="1" required />
          </label>
          <label>
            Max replicas
            <input id="maxReplicas" type="number" min="1" max="100" value="5" required />
          </label>
          <label>
            CPU threshold
            <input id="cpuThreshold" type="number" min="10" max="95" value="70" required />
          </label>
          <label>
            Ingress host
            <input id="ingressHost" placeholder="optional" />
          </label>
          <label class="wide">
            Environment variables
            <textarea id="envVars" rows="4" placeholder="DATABASE_URL=postgres://...&#10;REDIS_URL=redis://..."></textarea>
          </label>
          <button type="submit">Deploy Image</button>
        </form>
        <p id="deployMessage" class="message"></p>
      </section>

      <section class="panel apps-panel">
        <div class="panel-heading">
          <h2>Apps</h2>
          <button id="refreshButton" class="ghost" type="button">Refresh</button>
        </div>
        <div id="appsList" class="apps-list"></div>
      </section>

      <section class="panel logs-panel">
        <div class="panel-heading">
          <h2>Logs</h2>
          <span id="logsTarget" class="pill">select app</span>
        </div>
        <pre id="logsOutput">Choose an app and click Logs.</pre>
      </section>
    </main>

    <script src="/dashboard/app.js"></script>
  </body>
</html>
