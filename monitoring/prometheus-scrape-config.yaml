apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-scrape-config
  namespace: monitoring
  labels:
    app: prometheus
  annotations:
    prometheus.io/scrape: 'true'
data:
  prometheus.yml: |
    scrape_configs:
      - job_name: 'idp-api'
        metrics_path: /monitoring/metrics
        static_configs:
          - targets: ['idp-api.default.svc.cluster.local:8000']
